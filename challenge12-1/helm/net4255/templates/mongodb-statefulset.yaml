apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: mboukraa
  labels:
    app: mongodb
spec:
  serviceName: "mongodb"
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 200m       # augmenté
              memory: 512Mi   # augmenté
            limits:
              cpu: 500m       # augmenté
              memory: 1Gi     # augmenté
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi   # taille PVC augmentée
