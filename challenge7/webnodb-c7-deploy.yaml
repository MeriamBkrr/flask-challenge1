apiVersion: apps/v1
kind: Deployment
metadata:
  name: webnodb-c7
  namespace: mboukraa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webnodb-c7
  template:
    metadata:
      labels:
        app: webnodb-c7
    spec:
      containers:
      - name: webnodb
        image: meriambkrr/challenge4-flask-nodb:v1
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "200Mi"
