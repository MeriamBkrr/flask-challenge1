version: "3.8"

services:
  flask-db:
    build: ./flask-db
    container_name: flask_db
    networks:
      - app_net
    depends_on:
      - mongodb

  flask-nodb:
    build: ./flask-nodb
    container_name: flask_nodb
    networks:
      - app_net

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    networks:
      - app_net
    ports:
      - "27017:27017"

  nginx:
    image: nginx:latest
    container_name: nginx_lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask-db
      - flask-nodb
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
